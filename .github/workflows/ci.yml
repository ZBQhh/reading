name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: npm install

      # 核心门槛（无需浏览器，必须全绿才允许发布）
      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Build portal
        run: npm run build

      - name: Stress & robustness test
        run: npm test

      # 浏览器相关验证（需 chromium 二进制）
      - name: Install chromium (playwright-core)
        run: npx playwright-core install --with-deps chromium || npx playwright-core install chromium || true

      - name: Functional smoke test
        run: npm run smoke

      - name: Browser layout audit
        run: npm run audit
